[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "2.0.0"
description = "Multi-agent code governance system with pluggable public LLM providers"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "gitpython>=3.1",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "flask>=3.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "anthropic>=0.40",
]
anthropic = [
    "anthropic>=0.40",
]
workflow = [
    "hdbscan>=0.8.33",
    "sentence-transformers>=3.0",
    "PyYAML>=6.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]

[tool.setuptools.package-data]
# Ship non-Python assets (e.g. the vendored vis-network.min.js used to make
# graphify output offline-ready) inside the wheel/sdist.
"sentinel.reports" = ["assets/*", "consequences.yaml", "templates/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=sentinel --cov-report=term-missing -q"

[tool.coverage.run]
omit = ["tests/*", "sentinel/__main__.py"]
